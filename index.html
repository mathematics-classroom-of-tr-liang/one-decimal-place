<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>一位小數探險家：圈選與平分</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            background-color: #f8fafc;
        }
        .fraction-line {
            height: 4px;
            background-color: #334155;
            width: 100%;
            margin: 2px 0;
        }
        .piece-transition {
            transition: fill 0.2s ease;
        }
        #drawing-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }
        .step-active {
            border: 3px solid #fbbf24 !important;
            background-color: #fffbeb !important;
            transform: scale(1.02);
        }
        .step-locked {
            opacity: 0.4;
            pointer-events: none;
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden text-slate-800">

    <!-- 頂部導覽列 -->
    <header class="bg-white border-b p-4 flex justify-between items-center shadow-sm z-50">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-black text-indigo-600 tracking-tight">一位小數探險家</h1>
            <div id="mission-box" class="bg-indigo-600 text-white px-6 py-2 rounded-2xl flex items-center gap-3 shadow-md">
                <span class="font-bold">今日目標：</span>
                <span id="target-decimal" class="text-2xl font-black">0.4</span>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="generateTask()" class="px-4 py-2 bg-amber-500 text-white rounded-xl font-bold shadow-md active:scale-95 transition-all">
                🎲 換個題目
            </button>
            <button onclick="reset()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl font-bold active:scale-95 transition-all">
                🔄 重置
            </button>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden relative">
        <!-- 繪圖層（用於圈選） -->
        <canvas id="drawing-canvas"></canvas>

        <!-- 左側：操作區域 -->
        <section id="op-area" class="flex-[2] p-4 flex flex-col items-center justify-between bg-white relative">
            <!-- 指導語文字區 -->
            <div id="instruction-text" class="w-full text-center py-4 px-6 bg-slate-50 rounded-2xl border-2 border-slate-100 text-xl font-bold text-slate-600">
                第一步：請用手指圈出正中間的正方形！
            </div>

            <!-- 表徵顯示區 -->
            <div id="canvas-container" class="flex-1 w-full flex items-center justify-center p-2 min-h-0">
                <div id="workspace" class="relative bg-slate-50 border-2 border-dashed border-slate-200 rounded-[28px] w-full max-w-[360px] aspect-square flex items-center justify-center p-2 transition-all">
                    <svg id="main-svg" viewBox="0 0 400 400" class="w-full h-full max-h-[340px]"></svg>
                </div>
            </div>

            <!-- 反饋提示區 -->
            <div id="feedback" class="h-12 flex items-center justify-center text-xl font-bold text-indigo-500">
                加油！我們先把正方形圈起來。
            </div>
        </section>

        <!-- 右側：控制與符號區域 -->
        <section class="flex-1 border-l bg-slate-50 p-4 flex flex-col gap-3 shadow-inner overflow-y-auto z-40">
            
            <div id="step-1-card" class="bg-white p-3 rounded-2xl shadow-sm border-2 border-slate-100 transition-all">
                <h3 class="font-bold text-slate-500 mb-1 flex items-center gap-2 text-sm">
                    <span class="bg-slate-400 text-white w-5 h-5 rounded-full flex justify-center items-center text-xs">1</span>
                    確認單位量 (1個)：
                </h3>
                <div id="unit-status" class="py-2 text-center rounded-xl bg-slate-100 font-bold text-xs text-slate-400">
                    尚未圈選圖形
                </div>
            </div>

            <div id="step-2-card" class="bg-white p-3 rounded-2xl shadow-sm border-2 border-slate-100 step-locked transition-all">
                <h3 class="font-bold text-slate-500 mb-1 flex items-center gap-2 text-sm">
                    <span class="bg-slate-400 text-white w-5 h-5 rounded-full flex justify-center items-center text-xs">2</span>
                    平分成 10 份：
                </h3>
                <button id="split-btn" onclick="performSplit()" class="w-full py-2.5 bg-indigo-500 text-white rounded-xl font-bold text-base shadow-md active:scale-95">
                    ✨ 變身：平分成 10 份
                </button>
            </div>

            <div id="step-3-card" class="bg-white p-3 rounded-2xl shadow-sm border-2 border-slate-100 step-locked transition-all flex flex-col gap-2">
                <h3 class="font-bold text-slate-500 flex items-center gap-2 text-sm">
                    <span class="bg-slate-400 text-white w-5 h-5 rounded-full flex justify-center items-center text-xs">3</span>
                    看一看拿出多少：
                </h3>
                
                <div class="flex gap-3">
                    <div class="flex-1 bg-slate-50 p-2.5 rounded-xl border border-slate-100 flex flex-col items-center justify-center">
                        <div id="numerator" class="text-2xl font-black text-purple-600">0</div>
                        <div class="fraction-line w-6"></div>
                        <div class="text-2xl font-black text-slate-400">10</div>
                    </div>
                    <div class="flex-1 bg-purple-50 p-2.5 rounded-xl border border-purple-100 flex flex-col items-center justify-center">
                        <div class="flex items-baseline gap-0.5">
                            <span class="text-2xl font-black text-slate-300">0</span>
                            <span class="text-2xl font-black text-slate-300">.</span>
                            <span id="decimal-value" class="text-3xl font-black text-purple-600">0</span>
                        </div>
                    </div>
                </div>
            </div>

            <button onclick="checkAnswer()" id="check-btn" class="mt-auto w-full py-3.5 bg-emerald-500 text-white rounded-2xl font-bold text-lg shadow-md active:scale-95 step-locked">
                檢查結果 ✅
            </button>
        </section>
    </main>

    <script>
        let state = {
            isCircled: false,
            isSplit: false,
            // 紀錄每一格的選取狀態，預設皆為未選取 (false)
            selectedPieces: Array(10).fill(false),
            targetN: 4
        };

        // 計算目前共選取了多少格
        function getSelectedCount() {
            return state.selectedPieces.filter(p => p).length;
        }

        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');
        const svg = document.getElementById('main-svg');
        const feedback = document.getElementById('feedback');
        const instruction = document.getElementById('instruction-text');
        
        let isDrawing = false;
        let points = [];

        function init() {
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            setupDrawing();
            generateTask();
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function generateTask() {
            state.targetN = Math.floor(Math.random() * 9) + 1;
            document.getElementById('target-decimal').innerText = `0.${state.targetN}`;
            reset();
        }

        function reset() {
            state.isCircled = false;
            state.isSplit = false;
            state.selectedPieces = Array(10).fill(false);
            
            document.getElementById('unit-status').innerText = "尚未圈選圖形";
            document.getElementById('unit-status').className = "py-3 text-center rounded-xl bg-slate-100 font-bold text-slate-400";
            document.getElementById('step-1-card').classList.add('step-active');
            document.getElementById('step-2-card').classList.add('step-locked');
            document.getElementById('step-3-card').classList.add('step-locked');
            document.getElementById('check-btn').classList.add('step-locked');
            
            instruction.innerText = "第一步：請用手指圈出正中間的正方形！";
            feedback.innerText = "加油！我們先把正方形圈起來。";
            feedback.className = "h-16 flex items-center justify-center text-2xl font-bold text-indigo-500";
            
            render();
        }

        function setupDrawing() {
            const opArea = document.getElementById('op-area');
            
            const start = (e) => {
                if (state.isCircled) return;
                isDrawing = true;
                points = [];
                const pos = getPos(e);
                points.push(pos);
            };

            const move = (e) => {
                if (!isDrawing) return;
                const pos = getPos(e);
                points.push(pos);
                drawPath();
            };

            const end = () => {
                if (!isDrawing) return;
                isDrawing = false;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                checkCircle();
            };

            opArea.addEventListener('mousedown', start);
            opArea.addEventListener('mousemove', move);
            window.addEventListener('mouseup', end);
            
            opArea.addEventListener('touchstart', (e) => { e.preventDefault(); start(e); }, { passive: false });
            opArea.addEventListener('touchmove', (e) => { e.preventDefault(); move(e); }, { passive: false });
            window.addEventListener('touchend', end);
        }

        // 修正觸控與滑鼠座標計算，將視窗座標轉為 Canvas 相對座標
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            return { 
                x: clientX - rect.left, 
                y: clientY - rect.top 
            };
        }

        function drawPath() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 6;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            if (points.length < 2) return;
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.stroke();
        }

        function checkCircle() {
            if (points.length < 10) return;
            
            const workspace = document.getElementById('workspace');
            const rect = workspace.getBoundingClientRect();
            const canvasRect = canvas.getBoundingClientRect();

            // 將 workspace 的中心點轉換至 Canvas 相對座標系統中比較
            const centerX = (rect.left + rect.width / 2) - canvasRect.left;
            const centerY = (rect.top + rect.height / 2) - canvasRect.top;

            let minX = Math.min(...points.map(p => p.x)), maxX = Math.max(...points.map(p => p.x));
            let minY = Math.min(...points.map(p => p.y)), maxY = Math.max(...points.map(p => p.y));

            if (centerX > minX && centerX < maxX && centerY > minY && centerY < maxY) {
                state.isCircled = true;
                handleStep1Complete();
            }
        }

        function handleStep1Complete() {
            document.getElementById('unit-status').innerText = "✅ 已確認單位量 1";
            document.getElementById('unit-status').className = "py-2 text-center rounded-xl bg-amber-100 font-bold text-xs text-amber-600 border border-amber-300";
            document.getElementById('step-1-card').classList.remove('step-active');
            document.getElementById('step-2-card').classList.remove('step-locked');
            document.getElementById('step-2-card').classList.add('step-active');
            
            instruction.innerText = "第二步：請點點右邊的「變身按鈕」！";
            feedback.innerText = "圈得好準！現在來平分它吧。";
            render();
        }

        function performSplit() {
            state.isSplit = true;
            document.getElementById('step-2-card').classList.remove('step-active');
            document.getElementById('step-3-card').classList.remove('step-locked');
            document.getElementById('step-3-card').classList.add('step-active');
            document.getElementById('check-btn').classList.remove('step-locked');
            
            instruction.innerText = "第三步：請點點正方形格子，拿出 0." + state.targetN;
            feedback.innerText = "變身成功！這就是平分成 10 份。";
            render();
        }

        // 修改點選邏輯：點哪格就切換哪格的狀態 (單格獨立點選，一次一個 0.1)
        function togglePiece(idx) {
            if (!state.isSplit) return;
            state.selectedPieces[idx] = !state.selectedPieces[idx];
            render();
        }

        function render() {
            svg.innerHTML = '';
            const size = 400;
            const pad = 20;
            const inner = size - pad * 2;

            if (!state.isSplit) {
                const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                rect.setAttribute("x", pad); rect.setAttribute("y", pad);
                rect.setAttribute("width", inner); rect.setAttribute("height", inner);
                rect.setAttribute("fill", "#fff");
                rect.setAttribute("stroke", state.isCircled ? "#fbbf24" : "#94a3b8");
                rect.setAttribute("stroke-width", state.isCircled ? "8" : "3");
                rect.setAttribute("rx", "12");
                svg.appendChild(rect);

                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("x", 200); text.setAttribute("y", 235);
                text.setAttribute("text-anchor", "middle");
                text.setAttribute("fill", state.isCircled ? "#d97706" : "#94a3b8");
                text.setAttribute("font-size", "140");
                text.setAttribute("font-weight", "black");
                text.textContent = "1";
                svg.appendChild(text);
            } else {
                const w = inner / 10;
                for (let i = 0; i < 10; i++) {
                    const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                    r.setAttribute("x", pad + i * w); r.setAttribute("y", pad);
                    r.setAttribute("width", w); r.setAttribute("height", inner);
                    // 根據該格是否被選取來著色
                    r.setAttribute("fill", state.selectedPieces[i] ? "#a855f7" : "#fff");
                    r.setAttribute("stroke", "#94a3b8");
                    r.setAttribute("stroke-width", "2");
                    r.setAttribute("class", "piece-transition");
                    r.style.cursor = "pointer";
                    r.onclick = () => togglePiece(i);
                    svg.appendChild(r);
                }
                const border = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                border.setAttribute("x", pad); border.setAttribute("y", pad);
                border.setAttribute("width", inner); border.setAttribute("height", inner);
                border.setAttribute("fill", "none"); border.setAttribute("stroke", "#475569");
                border.setAttribute("stroke-width", "4"); border.setAttribute("rx", "12");
                border.style.pointerEvents = "none";
                svg.appendChild(border);
            }

            const currentCount = getSelectedCount();
            document.getElementById('numerator').innerText = currentCount;
            document.getElementById('decimal-value').innerText = currentCount;
            
            const decNodes = document.getElementById('decimal-value').parentElement.children;
            if (currentCount > 0) {
                decNodes[0].classList.replace('text-slate-300', 'text-slate-700');
                decNodes[1].classList.replace('text-slate-300', 'text-slate-700');
            } else {
                decNodes[0].className = 'text-2xl font-black text-slate-300';
                decNodes[1].className = 'text-2xl font-black text-slate-300';
            }
        }

        function checkAnswer() {
            const currentCount = getSelectedCount();
            if (currentCount === state.targetN) {
                feedback.innerText = "🌈 太棒了！這就是 0." + state.targetN + "！";
                feedback.className = "h-12 flex items-center justify-center text-2xl font-black text-emerald-600 animate-bounce";
                instruction.innerText = "挑戰成功！你拿出了 " + currentCount + " 個 0.1。";
            } else {
                const msg = currentCount < state.targetN ? "還差一點點，再點幾格！" : "拿太多了，再點一次選中的格子收回來。";
                feedback.innerText = "❌ " + msg;
                feedback.className = "h-12 flex items-center justify-center text-xl font-bold text-rose-500";
            }
        }

        window.onload = init;
    </script>
</body>
</html>
